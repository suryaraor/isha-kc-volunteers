<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Satsang Materials Signup</title>
    <link rel="stylesheet" href="../style.css?v=4">
    <link rel="stylesheet" href="style.css?v=3">
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🪔 Satsang Materials</h1>
            <div class="count-box">
                <div class="count-label">Still needed</div>
                <div class="count-number" id="neededCount">–</div>
                <div class="count-label">of <span id="itemCount">–</span></div>
            </div>
        </div>

        <!-- Satsang month countdown (filled by renderCycle in common.js) -->
        <div class="cycle">
            <div class="cycle-top">
                <div>
                    <div class="cycle-month" id="cycleMonth"></div>
                    <div class="cycle-target">🎯 Satsang: <strong id="cycleTarget"></strong></div>
                </div>
                <div class="cycle-left"><span id="cycleDays">0</span><small id="cycleDaysLabel">days left</small></div>
            </div>
            <div class="progress" role="progressbar" aria-label="Days until Satsang" id="cycleProgress">
                <div class="progress-fill" id="cycleFill"></div>
            </div>
            <div class="cycle-range"><span id="cycleStart"></span><span id="cycleEnd"></span></div>
        </div>

        <div id="loadingIndicator" class="loading"><p>Loading...</p></div>
        <div id="errorMessage" class="error-message" style="display: none;"></div>
        <div id="toast" class="toast" style="display: none;"></div>

        <!-- Live status first; signing up needs a name -->
        <section id="stepMaterials" style="display: none;">
            <!-- Not identified yet: one simple box, names appear as you type -->
            <div id="whoBox" class="who-box">
                <input type="text" id="identifySearch" class="who-input" placeholder="🔍 Type your name to sign up" autocomplete="off" autocapitalize="words" enterkeyhint="search">
                <div id="activeList" class="who-results" style="display: none;"></div>
                <div id="noActive" class="who-none" style="display: none;">No matching name</div>
            </div>
            <div id="meBar" class="me-bar" style="display: none;">
                <div>Hi, <strong id="meName"></strong></div>
                <button id="notMeBtn" class="link-btn">Not you?</button>
            </div>

            <div class="section-head">
                <h2 id="gridTitle">This month's status</h2>
                <p id="gridHint"></p>
            </div>
            <div id="mySummary" class="my-summary" style="display: none;"></div>
            <div id="materialGrid" class="mat-grid"></div>

            <div class="mat-actions">
                <button id="shareBtn" class="share-btn">💬 Share what's still needed on WhatsApp</button>
                <a href="../" class="back-link">‹ Back to volunteer outreach</a>
            </div>
        </section>

        <!-- First-run setup -->
        <section id="setupInstructions" class="setup-instructions" style="display: none;">
            <h2>Connect to Google Sheet</h2>
            <p>Paste the Apps Script web app URL (see README.md). It is saved in this browser only.</p>
            <input type="text" id="urlInput" class="search-input" placeholder="https://script.google.com/macros/s/.../exec">
            <button id="saveUrlBtn" class="primary-btn">Save &amp; load</button>
        </section>
    </div>

    <!-- Month picker for one item: slides up from the bottom -->
    <div id="sheetBackdrop" class="sheet-backdrop" style="display: none;"></div>
    <div id="monthSheet" class="month-sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle" style="display: none;">
        <div class="sheet-grip"></div>
        <div class="sheet-head">
            <span class="sheet-icon" id="sheetIcon"></span>
            <div class="sheet-titles">
                <h3 id="sheetTitle"></h3>
                <p>Which Satsangs can you bring it to?</p>
            </div>
            <button id="sheetClose" class="sheet-close" aria-label="Close">✕</button>
        </div>
        <div class="quick-picks">
            <button id="pickThis" class="qp" type="button"><span>📅</span>This month</button>
            <button id="pickYear" class="qp" type="button"><span>🔁</span>Whole year</button>
            <button id="pickNone" class="qp" type="button"><span>↺</span>Clear</button>
        </div>
        <div id="monthGrid" class="month-grid"></div>
        <button id="sheetSave" class="primary-btn sheet-save" type="button">Save</button>
    </div>

    <script src="../common.js?v=4"></script>
    <script src="script.js?v=6"></script>
</body>
</html>
